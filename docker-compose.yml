services:
  agent:
    build:
      context: .
      dockerfile: apps/agent/Dockerfile.dev
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/app
    env_file:
      - .env
    volumes:
      - ./apps/agent:/app/apps/agent
      - ./packages:/app/packages
      - /app/apps/agent/node_modules
    command: pnpm --filter @boilerplate/agent dev
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    working_dir: /app/apps/web
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/app
      - INNGEST_BASE_URL=http://inngest:8288
      - INNGEST_EVENT_KEY=local
    env_file:
      - .env
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      - /app/apps/web/node_modules
      - /app/apps/web/.next
    command: pnpm dev
    restart: unless-stopped
    depends_on:
      - postgres

  studio:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    ports:
      - "4983:4983"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/app
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      - /app/apps/web/node_modules
    command: pnpm --filter @boilerplate/web db:studio --host 0.0.0.0
    restart: unless-stopped
    depends_on:
      - postgres

  inngest:
    image: inngest/inngest:latest
    ports:
      - "8288:8288"
    environment:
      - INNGEST_DEV=1
    volumes:
      - ./inngest:/var/inngest
    command: "inngest dev --host 0.0.0.0 -u http://web:3000/api/inngest"
    restart: always

  postgres:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=app
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
